# Recepcionista virtual — ejemplo de nginx
#
# Bloque para el `server` del sitio: el servicio escucha en 127.0.0.1:8790 y solo
# nginx le habla, por eso el proceso confía en `X-Real-IP` únicamente cuando la
# conexión viene de un proxy de `RECEPCIONISTA_PROXIES_CONFIABLES`.
#
# Si el servicio corre en Docker con red bridge, el socket que ve el proceso es
# el del gateway (no loopback): hay que agregar la IP del gateway al valor de
# `RECEPCIONISTA_PROXIES_CONFIABLES`. Si no, todos los visitantes comparten un
# solo límite por IP.
location /api/recepcionista/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 45s;
    proxy_read_timeout 45s;

    # 32 KB alcanzan para 12 mensajes y 300 turnos saneados.
    client_max_body_size 32k;
    client_body_buffer_size 32k;

    add_header Cache-Control "no-store" always;
}
